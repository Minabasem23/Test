<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="//libtl.com/sdk.js"
data-zone="10638478"
data-sdk="show_10638478"></script>

<title>Ad Reward</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080b12;
    color:white;
    font-family:Arial,sans-serif;
    min-height:100vh;
    padding:18px;
}

.app{
    max-width:430px;
    margin:auto;
}

h1{
    text-align:center;
    margin:5px 0 18px;
}

.warning{
    background:#3b2911;
    border:1px solid #80601e;
    border-radius:14px;
    padding:14px;
    margin-bottom:12px;
    line-height:1.6;
}

.ad{
    height:220px;
    background:#111722;
    border:1px solid #293243;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    margin-bottom:12px;
}

.ad small{
    opacity:.6;
}

button{
    width:100%;
    border:0;
    border-radius:13px;
    padding:14px;
    margin:6px 0;
    font-size:16px;
    font-weight:bold;
    color:white;
}

button:disabled{
    opacity:.45;
}

.watch{
    background:#159447;
}

.save{
    background:#1671b8;
}

.withdraw{
    background:#7b43a5;
}

.card{
    background:#111722;
    border:1px solid #293243;
    border-radius:14px;
    padding:14px;
    margin-top:10px;
}

.row{
    display:flex;
    justify-content:space-between;
    margin:8px 0;
}

.bar{
    height:8px;
    background:#293243;
    border-radius:10px;
    overflow:hidden;
}

.bar i{
    display:block;
    height:100%;
    width:0%;
    background:#159447;
}

#msg{
    text-align:center;
    min-height:24px;
    margin-top:12px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#000b;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.box{
    width:100%;
    max-width:400px;
    background:#111722;
    border-radius:18px;
    padding:18px;
}

input{
    width:100%;
    padding:13px;
    margin:7px 0;
    border-radius:10px;
    border:1px solid #344052;
    background:#080b12;
    color:white;
}

.close{
    background:#303847;
}
</style>
</head>

<body>

<div class="app">

<h1>🎁 Ad Reward</h1>

<div class="warning">
⚠️ <b>تحذير</b><br>
شاهد الإعلان من زر المشاهدة. هذه نسخة تجريبية، والسحب فيها محاكاة فقط.
</div>

<div class="ad">
    <div>
        📺<br>
        <b>إعلان Monetag</b><br>
        <small>Zone 10638478</small>
    </div>
</div>

<button class="watch" id="watch">
🎬 مشاهدة الإعلان
</button>

<!-- الحد اليومي تحت الزر -->
<div class="card">

    <div class="row">
        <span>👁️ المشاهدات اليومية</span>
        <b id="views">0 / 150</b>
    </div>

    <div class="bar">
        <i id="bar"></i>
    </div>

    <div class="row">
        <span>💰 الرصيد التجريبي</span>
        <b id="balance">0.000</b>
    </div>

</div>

<button class="withdraw" id="withdraw">
💸 سحب تجريبي
</button>

<button class="save" id="save">
💾 حفظ البيانات
</button>

<div id="msg"></div>

</div>


<!-- نافذة السحب -->

<div class="modal" id="modal">

<div class="box">

<h2>💸 سحب تجريبي</h2>

<p>
هذا السحب تجريبي فقط ولا يتم إرسال أموال حقيقية.
</p>

<input
id="amount"
type="number"
min="0.001"
step="0.001"
placeholder="المبلغ"
>

<input
id="address"
type="text"
placeholder="عنوان BEP20 تجريبي"
>

<button
class="withdraw"
id="confirm"
>
تأكيد السحب التجريبي
</button>

<button
class="close"
id="close"
>
إغلاق
</button>

</div>

</div>


<script>

const LIMIT = 150;
const REWARD = 0.001;

const STORAGE_KEY = "ad_reward_demo";


function getToday(){

    const d = new Date();

    return d.getFullYear() +
    "-" +
    String(d.getMonth()+1).padStart(2,"0") +
    "-" +
    String(d.getDate()).padStart(2,"0");

}


let data;

try{

    data = JSON.parse(
        localStorage.getItem(STORAGE_KEY)
    );

}catch(e){

    data = null;

}


if(
    !data ||
    data.date !== getToday()
){

    data = {

        date:getToday(),

        views:0,

        balance:0

    };

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


const watch =
document.getElementById("watch");

const views =
document.getElementById("views");

const balance =
document.getElementById("balance");

const bar =
document.getElementById("bar");

const msg =
document.getElementById("msg");

const modal =
document.getElementById("modal");


function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(data)
    );

}


function update(){

    views.textContent =
        data.views + " / " + LIMIT;

    balance.textContent =
        Number(data.balance).toFixed(3);

    bar.style.width =
        Math.min(
            100,
            data.views / LIMIT * 100
        ) + "%";


    if(data.views >= LIMIT){

        watch.disabled = true;

        watch.textContent =
            "🚫 وصلت للحد اليومي";

    }else{

        watch.disabled = false;

        watch.textContent =
            "🎬 مشاهدة الإعلان";

    }

}


update();


/*
================================
تشغيل إعلان Monetag
================================
*/

watch.addEventListener(
"click",
async function(){

    if(data.views >= LIMIT){

        return;

    }


    watch.disabled = true;

    msg.textContent =
        "⏳ جاري فتح الإعلان...";


    try{

        if(
            typeof window.show_10638478
            !== "function"
        ){

            throw new Error(
                "Monetag SDK غير جاهز"
            );

        }


        await window.show_10638478({

            type:"end",

            ymid:
                "demo_" +
                Date.now()

        });


        /*
        الإعلان اكتمل
        */

        data.views++;

        data.balance =
            Number(
                (
                    data.balance +
                    REWARD
                ).toFixed(3)
            );


        saveData();

        update();


        msg.textContent =
            "✅ تمت المشاهدة وإضافة 0.001 تجريبيًا.";


    }catch(error){

        console.error(error);

        msg.textContent =
            "❌ لم يفتح الإعلان أو لم تكتمل العملية.";

        update();

    }

});


/*
================================
فتح السحب
================================
*/

document
.getElementById("withdraw")
.addEventListener(
"click",
function(){

    if(
        Number(data.balance)
        < 0.001
    ){

        msg.textContent =
            "❌ الرصيد أقل من 0.001.";

        return;

    }


    modal.style.display =
        "flex";

});


/*
================================
إغلاق السحب
================================
*/

document
.getElementById("close")
.addEventListener(
"click",
function(){

    modal.style.display =
        "none";

});


/*
================================
تأكيد السحب التجريبي
================================
*/

document
.getElementById("confirm")
.addEventListener(
"click",
function(){

    const amount =
        Number(
            document
            .getElementById("amount")
            .value
        );


    const address =
        document
        .getElementById("address")
        .value
        .trim();


    if(amount < 0.001){

        alert(
            "الحد الأدنى هو 0.001"
        );

        return;

    }


    if(
        amount >
        Number(data.balance)
    ){

        alert(
            "الرصيد غير كافٍ"
        );

        return;

    }


    if(!address){

        alert(
            "اكتب عنوانًا تجريبيًا"
        );

        return;

    }


    modal.style.display =
        "none";


    msg.textContent =
        "🧪 تم إنشاء طلب السحب التجريبي بقيمة " +
        amount.toFixed(3);

});


/*
================================
حفظ البيانات
================================
*/

document
.getElementById("save")
.addEventListener(
"click",
function(){

    saveData();


    /*
    Deep Link إلى البوت
    */

    const payload =
        "save_" +
        data.views +
        "_" +
        Number(data.balance)
        .toFixed(3);


    const link =
        "https://t.me/Godbymoon_bot?start=" +
        encodeURIComponent(payload);


    msg.textContent =
        "💾 تم حفظ البيانات. جاري العودة للبوت...";


    setTimeout(
        function(){

            window.location.href =
                link;

        },
        700
    );

});


</script>

</body>
</html>
