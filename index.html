position:fixed;
inset:0;

<body>

<iframe
id="frame">
</iframe>

<div id="overlay">

<div>
📺 Advertisement
</div>

<div id="timer">
20
</div>

</div>

<script>

const SITE =
"https://www.xnxx-arabic.com";

const frame =
document.getElementById("frame");

const overlay =
document.getElementById("overlay");

const timerEl =
document.getElementById("timer");

// فتح الموقع مرة واحدة فقط
frame.src = SITE;

// كل دقيقة
setInterval(async ()=>{

// إخفاء iframe فقط
frame.style.visibility = "hidden";

// شاشة الإعلان
overlay.style.display = "flex";

// تشغيل الإعلان
try{

if(typeof show_10638478
=== "function"){

await show_10638478({
ymid:"user_test"
});

}

}catch(e){}

// عداد 20 ثانية
let time = 20;

timerEl.innerText = time;

const countdown =
setInterval(()=>{

time--;

timerEl.innerText = time;

if(time <= 0){

clearInterval(countdown);

// إظهار iframe مرة أخرى
overlay.style.display = "none";

frame.style.visibility = "visible";

}

},1000);

},60000);

</script>
