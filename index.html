// عداد 15 ثانية
let time = 15;

timerEl.innerText = time;

const countdown =
setInterval(()=>{

time--;

timerEl.innerText = time;

if(time <= 0){

clearInterval(countdown);

// إخفاء شاشة الإعلان

// إعادة iframe كما كان
frame.style.display = "block";
