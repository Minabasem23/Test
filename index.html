<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Web App</title>

<script src="//libtl.com/sdk.js"
data-zone="10638478"
data-sdk="show_10638478"></script>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Arial;
}

.topbar{
position:fixed;
top:0;
left:0;
right:0;
height:50px;
background:#111827;
display:flex;
align-items:center;
padding:0 10px;
z-index:9999;
}

input{
flex:1;
height:35px;
border:none;
outline:none;
border-radius:10px;
padding:0 10px;
font-size:14px;
}

button{
margin-left:10px;
height:35px;
border:none;
padding:0 15px;
border-radius:10px;
background:#2563eb;
color:#fff;
font-weight:bold;
}

iframe{
position:absolute;
top:50px;
left:0;
width:100%;
height:calc(100% - 50px);
border:none;
background:#fff;
}

</style>
</head>
<body>

<div class="topbar">

<input
id="url"
placeholder="https://example.com">

<button onclick="openSite()">
Open
</button>

</div>

<iframe id="frame"></iframe>

<script>

// ===== حفظ آخر موقع =====
const saved =
localStorage.getItem("LAST_SITE");

if(saved){

document.getElementById("url").value =
saved;

document.getElementById("frame").src =
saved;
}

// ===== فتح الموقع =====
function openSite(){

let url =
document.getElementById("url").value;

if(!url.startsWith("http")){
url = "https://www.xnxx-arabic.com" + url;
}

document.getElementById("frame").src =
url;

localStorage.setItem(
"LAST_SITE",
url
);

}

// ===== إعلان كل دقيقة =====
setInterval(async ()=>{

if(typeof show_10638478
!== "function"){
return;
}

try{

await show_10638478({
ymid:"user_test"
});

}catch(e){}

},60000);

</script>

</body>
</html>
