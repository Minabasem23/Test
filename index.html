<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ad Reward Demo</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:#0b0f17;
    color:#fff;
    display:flex;
    justify-content:center;
}
.app{
    width:100%;
    max-width:430px;
    padding:20px;
}
h1{text-align:center;margin:10px 0 20px}

.warning{
    background:#3a2610;
    border:1px solid #9b681d;
    border-radius:14px;
    padding:14px;
    margin-bottom:12px;
    line-height:1.6;
}

.ad{
    height:250px;
    border:1px solid #303846;
    border-radius:16px;
    background:#121824;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
    margin-bottom:14px;
}

button{
    width:100%;
    border:0;
    border-radius:13px;
    padding:15px;
    margin-top:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.watch{background:#28a745;color:white}
.save{background:#1769aa;color:white}
.withdraw{background:#8e44ad;color:white}

button:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.stats{
    background:#121824;
    border-radius:14px;
    padding:15px;
    margin-top:12px;
}

.row{
    display:flex;
    justify-content:space-between;
    margin:9px 0;
}

.progress{
    height:9px;
    background:#29313d;
    border-radius:10px;
    overflow:hidden;
    margin-top:10px;
}

.progress div{
    height:100%;
    width:0%;
    background:#28a745;
}

#message{
    text-align:center;
    margin-top:14px;
    min-height:24px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#000b;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.box{
    width:100%;
    max-width:390px;
    background:#121824;
    border-radius:18px;
    padding:20px;
}

input{
    width:100%;
    padding:14px;
    margin:8px 0;
    border-radius:10px;
    border:1px solid #394352;
    background:#0b0f17;
    color:white;
}
</style>
</head>

<body>

<div class="app">

<h1>🎁 Ad Reward</h1>

<div class="warning">
⚠️ <b>تحذير</b><br>
شاهد الإعلان من خلال زر المشاهدة. هذه نسخة تجريبية، والمكافآت والسحب فيها غير حقيقية.
</div>

<div class="ad" id="adBox">
    <div>
        📺<br>
        <b>إعلان Monetag</b><br>
        <small>Zone: 10638478</small>
    </div>
</div>

<button class="watch" id="watchBtn">
🎬 مشاهدة الإعلان
</button>

<!-- الحد اليومي تحت الزر -->
<div class="stats">
    <div class="row">
        <span>👁️ المشاهدات اليومية</span>
        <b id="views">0 / 150</b>
    </div>

    <div class="progress">
        <div id="bar"></div>
    </div>

    <div class="row">
        <span>💰 الرصيد التجريبي</span>
        <b id="balance">0.000</b>
    </div>
</div>

<button class="withdraw" id="withdrawBtn">
💸 سحب تجريبي
</button>

<button class="save" id="saveBtn">
💾 حفظ البيانات
</button>

<div id="message"></div>

</div>

<!-- نافذة السحب -->
<div class="modal" id="modal">
<div class="box">

<h2>💸 سحب تجريبي</h2>

<p>الحد الأدنى التجريبي: 0.001</p>

<input
 id="amount"
 type="number"
 min="0.001"
 step="0.001"
 placeholder="المبلغ"
/>

<input
 id="address"
 type="text"
 placeholder="عنوان BEP20 تجريبي"
/>

<button class="withdraw" id="confirm">
تأكيد السحب التجريبي
</button>

<button id="close">
إغلاق
</button>

</div>
</div>


<script>

/* =========================
   إعدادات
========================= */

const ZONE_ID = "10638478";
const DAILY_LIMIT = 150;
const REWARD = 0.001;


/* =========================
   البيانات
========================= */

let data = JSON.parse(
    localStorage.getItem("ad_demo_data") || "null"
);

const today = new Date().toISOString().slice(0,10);

if (!data || data.date !== today) {

    data = {
        date: today,
        views: 0,
        balance: 0
    };

    saveLocal();
}


/* =========================
   عناصر الصفحة
========================= */

const watchBtn = document.getElementById("watchBtn");
const viewsEl = document.getElementById("views");
const balanceEl = document.getElementById("balance");
const bar = document.getElementById("bar");
const message = document.getElementById("message");

const modal = document.getElementById("modal");
const withdrawBtn = document.getElementById("withdrawBtn");
const confirmBtn = document.getElementById("confirm");
const closeBtn = document.getElementById("close");


/* =========================
   تحديث الواجهة
========================= */

function updateUI(){

    viewsEl.textContent =
        `${data.views} / ${DAILY_LIMIT}`;

    balanceEl.textContent =
        Number(data.balance).toFixed(3);

    bar.style.width =
        `${Math.min(
            data.views / DAILY_LIMIT * 100,
            100
        )}%`;

    if(data.views >= DAILY_LIMIT){

        watchBtn.disabled = true;

        watchBtn.textContent =
            "🚫 وصلت للحد اليومي";

    }else{

        watchBtn.disabled = false;

        watchBtn.textContent =
            "🎬 مشاهدة الإعلان";
    }
}


/* =========================
   حفظ محلي
========================= */

function saveLocal(){

    localStorage.setItem(
        "ad_demo_data",
        JSON.stringify(data)
    );

}


/* =========================
   مشاهدة الإعلان
========================= */

watchBtn.addEventListener("click", async () => {

    if(data.views >= DAILY_LIMIT)
        return;

    watchBtn.disabled = true;

    message.textContent =
        "⏳ جاري فتح الإعلان...";

    /*
      ضع هنا كود Monetag SDK الذي يعطيه
      Monetag للـ Zone 10638478.

      لا نخمن كود SDK لأن صيغة الإعلان
      تختلف حسب نوع الـ Zone.
    */

    try {

        /*
        مثال:
        await show_10638478({
            type: 'end',
            ymid: 'user'
        });
        */

        /*
          Demo:
          ننتظر 10 ثوانٍ لمحاكاة مشاهدة الإعلان.
        */

        await new Promise(resolve =>
            setTimeout(resolve,10000)
        );

        data.views++;

        data.balance =
            Number(data.balance) + REWARD;

        saveLocal();
        updateUI();

        message.textContent =
            "✅ تمت إضافة المكافأة التجريبية.";

    } catch(e){

        message.textContent =
            "❌ لم تكتمل المشاهدة.";

    }

    updateUI();
});


/* =========================
   السحب التجريبي
========================= */

withdrawBtn.addEventListener("click", () => {

    if(Number(data.balance) < 0.001){

        message.textContent =
            "❌ الرصيد غير كافٍ.";

        return;
    }

    modal.style.display = "flex";
});


closeBtn.addEventListener("click", () => {

    modal.style.display = "none";

});


confirmBtn.addEventListener("click", () => {

    const amount =
        Number(document.getElementById("amount").value);

    const address =
        document.getElementById("address").value.trim();

    if(amount < 0.001){

        alert("الحد الأدنى هو 0.001");

        return;
    }

    if(amount > Number(data.balance)){

        alert("الرصيد غير كافٍ");

        return;
    }

    if(!address){

        alert("اكتب عنوانًا تجريبيًا");

        return;
    }

    modal.style.display = "none";

    message.textContent =
        `🧪 تم إنشاء طلب سحب تجريبي بقيمة ${amount.toFixed(3)}.`;

});


/* =========================
   حفظ البيانات والعودة للبوت
========================= */

document.getElementById("saveBtn")
.addEventListener("click", () => {

    saveLocal();

    /*
      Deep Link تجريبي.
      لا نرسل عنوانًا حقيقيًا أو ننفذ
      تحويلًا ماليًا.
    */

    const payload =
        "save_" +
        Number(data.balance).toFixed(3) +
        "_" +
        data.views;

    const link =
        "https://t.me/Godbymoon_bot?start=" +
        encodeURIComponent(payload);

    message.textContent =
        "💾 تم حفظ البيانات محليًا. جاري العودة للبوت...";

    setTimeout(() => {

        window.location.href = link;

    },1000);

});


updateUI();

</script>

</body>
</html>
