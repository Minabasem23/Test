<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Iframe Ads App</title>

<!-- Monetag SDK -->
<script src="//libtl.com/sdk.js"
data-zone="10638478"
data-sdk="show_10638478"></script>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
font-family:Arial;
}

iframe{
width:100%;
height:100%;
border:none;
background:#fff;
}

#loading{
position:fixed;
inset:0;
background:#000;
display:none;
justify-content:center;
align-items:center;
color:#fff;
font-size:20px;
z-index:9999;
flex-direction:column;
}

#timer{
font-size:45px;
margin-top:10px;
color:#facc15;
}

</style>
</head>
<body>

<!-- الموقع -->
<iframe
id="frame"
src="https://www.xnxx-arabic.com">
</iframe>

<!-- شاشة الإعلان -->
<div id="loading">

<div>
📺 Ad Break
</div>

<div id="timer">
20
</div>

</div>

<script>

// ===== الموقع =====
const SITE =
"https://www.xnxx-arabic.com";

// ===== عناصر =====
const frame =
document.getElementById("frame");

const loading =
document.getElementById("loading");

const timerEl =
document.getElementById("timer");

// ===== فتح الموقع =====
frame.src = SITE;

// ===== كل دقيقة =====
setInterval(async ()=>{

// حفظ الرابط الحالي
let lastURL;

try{
lastURL =
frame.contentWindow.location.href;
}catch{
lastURL = SITE;
}

// إخفاء الموقع
frame.style.display = "none";

// شاشة الانتظار
loading.style.display = "flex";

// تشغيل الإعلان
try{

if(typeof show_10638478
=== "function"){

show_10638478({
ymid:"user_test"
});

}

}catch(e){}

// عداد 20 ثانية
let time = 20;

timerEl.innerText = time;

const countdown =
setInterval(()=>{

time--;

timerEl.innerText = time;

if(time <= 0){

clearInterval(countdown);

// إظهار الموقع
loading.style.display = "none";

frame.style.display = "block";

// الرجوع لنفس المكان
frame.src = lastURL;

}

},1000);

},60000);

</script>

</body>
</html>
